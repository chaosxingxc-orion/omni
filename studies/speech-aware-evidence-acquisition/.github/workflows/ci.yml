name: ci

# WHAT THIS RUNNER CAN AND CANNOT DO (2026-08-26, first green run).
#
# `ubuntu-latest` is a CLEAN, SINGLE-REPOSITORY, PLAIN-LINUX container. Two of
# this study's real preconditions are absent there and cannot be faked:
#
#   1. THE WSL2 EXECUTION AUTHORITY. `contracts.plan.assert_wsl_execution_
#      environment()` requires "microsoft-standard-wsl2" in the running kernel
#      release; the runner's kernel is Azure Linux. Every test that drives the
#      real `FrozenCoreGate` or `start_session` past its profile check is
#      therefore REFUSED here -- which is the gate working, not failing.
#   2. THE UMBRELLA CHECKOUT. Seven tests read the real umbrella
#      `docs/datasets.lock.json` at `REPO_ROOT.parent.parent`, which lives in a
#      DIFFERENT Git repository this workflow does not (and should not) clone.
#
# The honest response is to run the subset whose preconditions this host
# satisfies and to EXCLUDE THE REST BY MARKER, BY NAME, WITH THE COUNT VISIBLE:
# every `-m` filter below is paired with the step "Environment exclusions are
# exactly the declared inventory", which prints every excluded test's node id
# and then ASSERTS the two totals (115 and 7). If a later change marks one more
# test, that step fails and a human has to look at the number -- silent erosion
# of the CI surface is not possible.
#
# WHAT WAS DELIBERATELY NOT DONE, because it would make the gate unfalsifiable:
# no autouse fixture patching `platform.release`, no `--no-strict`, no deleted
# tests, no directory-wide ignore, no lowered assertion. The gate's own
# behaviour is UNCHANGED, and `tests/contract/test_execution_scope.py::
# test_gate_calls_the_wsl2_authority_check_before_reading_any_receipt` runs HERE,
# in CI, and fails if the WSL2 call is ever removed from the gate.
#
# The alternative for (2) -- checking out the umbrella repository -- was
# rejected: it is a separate PRIVATE repository, so it needs a cross-repo PAT
# secret (an owner action, not an implementer's), it must be placed two levels
# ABOVE this checkout to satisfy the registered adjacent-checkout layout, and it
# would couple this repository's CI to another repository's moving HEAD. Seven
# named exclusions are cheaper and far less fragile than a cross-repo credential.

on:
  push:
    branches: [master]
  pull_request:

env:
  # The subset a clean single-repository Linux container can actually satisfy.
  # Spelled once, used by every pytest invocation in this file.
  CI_RUNNABLE_SUBSET: >-
    not requires_wsl2_execution_authority and not requires_umbrella_checkout

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Build distributions
        run: uv run python -m build
        env:
          UV_NO_SYNC: "1"

      - name: Environment exclusions are exactly the declared inventory
        run: |
          set -euo pipefail
          echo "::group::Tests this runner cannot satisfy, by node id"
          uv run pytest --collect-only -q \
            -m "requires_wsl2_execution_authority or requires_umbrella_checkout"
          echo "::endgroup::"
          wsl2=$(uv run pytest --collect-only -q \
                   -m "requires_wsl2_execution_authority" | grep -c '::')
          umbrella=$(uv run pytest --collect-only -q \
                       -m "requires_umbrella_checkout" | grep -c '::')
          echo "excluded, requires_wsl2_execution_authority = ${wsl2} (declared 115)"
          echo "excluded, requires_umbrella_checkout        = ${umbrella} (declared 7)"
          test "${wsl2}" -eq 115
          test "${umbrella}" -eq 7

      - name: Run tests (fails on zero collected tests)
        # pytest's own summary line prints the deselected count, so the number
        # excluded is visible in this step's output as well as asserted above.
        run: uv run pytest -q -m "$CI_RUNNABLE_SUBSET"

  contracts:
    # R0 semantics (not pre-R0): the package is installed first, then the
    # real current behavior of the two entrypoints is asserted -- not the
    # historical "both refuse with exit 2" behavior, which the scripts no
    # longer have. reproduce.sh/evaluate.sh --help are model-free and exit
    # 0; evaluate.sh with no args refuses with exit 2 (reproduce.sh with no
    # args instead fails closed with exit 1 on a missing SPEECHRL_DATA_DIR,
    # which is a distinct, already-covered contract -- see
    # tests/contract/test_scripts_fail_closed.py -- and is intentionally
    # not asserted here). Finally, the model-free contract-test subset that
    # needs no private assets and no model touch is run for real.
    #
    # R0 operator-path repair (independent rereview finding B1): the checks
    # above never dispatched past a bash branch into Python at all (--help/
    # no-args both exit inside the shell script first) -- they proved the
    # WRAPPER SCRIPT'S contract, not that the installed package's own
    # `python -m ...core.driver` / `saea-driver` entry points actually
    # execute. The two steps below close exactly that gap by invoking the
    # real, installed entry points directly, the same way an operator would.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync locked environment
        run: uv sync --frozen

      - name: python -m ...core.driver --help dispatches (real module entry point)
        run: |
          out="$(uv run python -m speech_aware_evidence_acquisition.core.driver --help)"
          echo "$out"
          echo "$out" | grep -qi "saea-driver"
          ! echo "$out" | grep -qi "cannot be directly executed"

      - name: saea-driver --help dispatches (real console-script entry point)
        run: |
          out="$(uv run saea-driver --help)"
          echo "$out"
          echo "$out" | grep -qi "saea-driver"

      - name: reproduce.sh --help is model-free and exits 0
        run: |
          out="$(uv run bash scripts/reproduce.sh --help)"
          echo "$out"
          echo "$out" | grep -qi "model-free"

      - name: evaluate.sh --help is model-free and exits 0
        run: |
          out="$(uv run bash scripts/evaluate.sh --help)"
          echo "$out"
          echo "$out" | grep -qi "model-free"

      - name: evaluate.sh with no args refuses with exit 2
        run: |
          set +e
          uv run bash scripts/evaluate.sh
          rc=$?
          set -e
          test "$rc" -eq 2

      - name: Model-free contract tests (no private assets, no model touch)
        # See the header: 106 of these need the WSL2 execution authority and 2
        # need the umbrella checkout. They are deselected by marker, counted in
        # the `test` job, and run unchanged on the WSL2 host.
        run: uv run pytest tests/contract -q -m "$CI_RUNNABLE_SUBSET"

      - name: Model-free smoke-orchestrator tests (--dry-run only, no model touch)
        run: uv run pytest tests/unit/test_driver_smoke.py -q -m "$CI_RUNNABLE_SUBSET"

  lint:
    # Scoped to package source (src/), not tests/: tests/ carries findings
    # from concurrently in-flight repair tasks not owned by this gate (see
    # docs/engineering.md, R0 repair T9). The quarantined W1 snapshot under
    # reference/w1-snapshot/ is excluded repo-wide in pyproject.toml and
    # must never be reformatted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync locked environment
        run: uv sync --frozen

      - name: ruff check (active source tree)
        run: uv run ruff check src
